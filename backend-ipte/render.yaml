services:
    - type: web
      name: backend-ipte
      env: node
      region: singapore
      plan: free
      buildCommand: npm ci --include=dev && npm run db:generate && npm run build
      preDeployCommand: npx prisma migrate deploy
      startCommand: npm run start
      healthCheckPath: /health
      envVars:
          - key: NODE_ENV
            value: production
          - key: DATABASE_URL
            fromDatabase:
                name: postgres-ipte
                property: connectionString
          - key: JWT_ACCESS_SECRET
            sync: false
          - key: JWT_ACCESS_EXPIRES
            value: 15m
          - key: SECRETS_KEY
            sync: false
          - key: CORS_ALLOWED_ORIGINS
            sync: false
          - key: PUBLIC_BASE_URL
            sync: false

databases:
    - name: postgres-ipte
      databaseName: ipte_v2
      plan: free
      region: singapore
