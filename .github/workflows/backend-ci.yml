name: Backend CI

on:
  pull_request:
    paths: ["backend-ipte/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend-ipte/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-ipte
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ipte_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ipte_v2_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ipte_v2_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-0123
      SECRETS_KEY: ci-only-secrets-key-ci-only-secrets-key-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-ipte/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
